<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="__FONT_URL__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: __BACKGROUND__; }
      #root { position: relative; width: 100%; height: 100%; font-family: "__FONT__", sans-serif; }
      .end-logo { position: absolute; left: 710px; top: 230px; width: 500px; display: __LOGO_DISPLAY__; }
      .end-url { position: absolute; left: 0; right: 0; top: __URL_TOP__px; text-align: center; font-size: 64px; font-weight: 700; color: __TEXT__; }
    </style>
  </head>
  <body>
    <!-- End card: logo (if the brand has one) and a URL. Variable: url. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1920" data-height="1080"
         data-composition-variables='[{"id":"url","type":"string","label":"URL","default":""}]'>
      <img id="logo" class="clip end-logo" src="assets/logo.png" alt="" data-start="0" data-duration="__DURATION__" data-track-index="0" />
      <div id="url" class="clip end-url" data-start="0" data-duration="__DURATION__" data-track-index="1"></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const D = __DURATION__;
      document.getElementById("url").textContent = v.url;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#logo", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#url", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.35);
      tl.to(["#logo", "#url"], { opacity: 0, duration: 0.3 }, D - 0.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
