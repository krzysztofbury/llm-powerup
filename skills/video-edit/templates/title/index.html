<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="__FONT_URL__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: __BACKGROUND__; }
      #root { position: relative; width: 100%; height: 100%; font-family: "__FONT__", sans-serif; }
      .logo { position: absolute; top: 48px; left: 64px; height: 92px; display: __LOGO_DISPLAY__; }
      .header { position: absolute; top: 70px; right: 72px; font-size: 34px; font-weight: 700; color: __TEXT__; }
      .header b { color: __ACCENT__; }
      .title { position: absolute; left: 0; right: 0; top: 360px; text-align: center; font-size: 168px; font-weight: 900; color: __ACCENT__; letter-spacing: -2px; }
      .bar { position: absolute; left: 700px; top: 580px; height: 10px; width: 520px; background: __ACCENT__; border-radius: 5px; transform-origin: left center; }
      .sub { position: absolute; left: 0; right: 0; top: 625px; text-align: center; font-size: 54px; font-weight: 400; color: __TEXT__; }
    </style>
  </head>
  <body>
    <!-- Title card. Brand placeholders (__NAME__) are filled by render.py; text comes from variables. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1920" data-height="1080"
         data-composition-variables='[{"id":"title","type":"string","label":"Title","default":"Title"},{"id":"subtitle","type":"string","label":"Subtitle","default":""},{"id":"header","type":"string","label":"Header topic","default":""}]'>
      <img id="logo" class="clip logo" src="assets/logo.png" alt="" data-start="0" data-duration="__DURATION__" data-track-index="0" />
      <div id="header" class="clip header" data-start="0" data-duration="__DURATION__" data-track-index="1"></div>
      <div id="title" class="clip title" data-start="0" data-duration="__DURATION__" data-track-index="2"></div>
      <div id="bar" class="clip bar" data-start="0" data-duration="__DURATION__" data-track-index="3"></div>
      <div id="sub" class="clip sub" data-start="0" data-duration="__DURATION__" data-track-index="4"></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const D = __DURATION__;
      // __HEADER_HTML__ is the brand's own markup (for a two-colour wordmark); topic text is set as text.
      const header = document.getElementById("header");
      header.innerHTML = "__HEADER_HTML__";
      header.appendChild(document.createTextNode((header.innerHTML ? " " : "") + v.header));
      document.getElementById("title").textContent = v.title;
      document.getElementById("sub").textContent = v.subtitle;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(["#logo", "#header"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0.35);
      tl.fromTo("#sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.6);
      tl.to(["#title", "#bar", "#sub"], { opacity: 0, duration: 0.25 }, D - 0.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
