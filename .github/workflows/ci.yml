name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect --source=/repo --log-opts="--all" --redact
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: pip install pre-commit==4.2.0
      - run: pre-commit run --all-files
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z '*.sh')
      - run: node --test tests/*.test.mjs integrations/opendeck/dev.krzysztof.agents.sdPlugin/test/*.test.js
      - run: bash skills/council/scripts/council_test.sh
      - run: bash skills/retro/scripts/ledger_test.sh
      - run: shellcheck hooks/claude/*.sh integrations/claude/*.sh scripts/*.sh
      - name: Test Claude guards
        run: |
          assert_ask() {
            printf '%s' "$1" | bash "$2" | jq -e '.hookSpecificOutput.permissionDecision == "ask"' >/dev/null
          }
          assert_pass() {
            local output
            output=$(printf '%s' "$1" | bash "$2")
            test -z "$output"
          }
          cmd_payload() {
            jq -cn --arg command "$1" '{tool_input: {command: $command}}'
          }

          # guard-readonly-postgres.sh
          assert_pass "$(cmd_payload "psql -c 'SELECT 1'")" hooks/claude/guard-readonly-postgres.sh
          assert_ask "$(cmd_payload "psql -c 'DELETE FROM example'")" hooks/claude/guard-readonly-postgres.sh
          assert_ask "$(cmd_payload "psql -c 'SELECT pg_terminate_backend(1)'")" hooks/claude/guard-readonly-postgres.sh
          assert_ask "$(cmd_payload "psql -c 'select 1' -c 'update t set x=1'")" hooks/claude/guard-readonly-postgres.sh
          assert_ask "$(cmd_payload "psql -c 'SELECT 1' -c 'SELECT 2'")" hooks/claude/guard-readonly-postgres.sh
          assert_ask "$(cmd_payload "psql -c 'SELECT 1' -c'DROP TABLE students'")" hooks/claude/guard-readonly-postgres.sh

          # block-dangerous.sh
          assert_ask "$(cmd_payload "rm -rf generated")" hooks/claude/block-dangerous.sh
          assert_pass "$(cmd_payload "rm /tmp/scratch.txt")" hooks/claude/block-dangerous.sh
          assert_ask "$(cmd_payload "ls | xargs rm")" hooks/claude/block-dangerous.sh
          assert_ask "$(cmd_payload "find / -name '*.log' -delete")" hooks/claude/block-dangerous.sh
          assert_ask "$(cmd_payload "mysql -e \"UPDATE users SET admin=1 WHERE id=5\"")" hooks/claude/block-dangerous.sh
          assert_pass "$(cmd_payload "truncate -s 0 file.log")" hooks/claude/block-dangerous.sh
          assert_pass "$(cmd_payload "git stash drop")" hooks/claude/block-dangerous.sh
          assert_pass "$(cmd_payload "git push --force-with-lease")" hooks/claude/block-dangerous.sh
          assert_ask "$(cmd_payload "git push --force")" hooks/claude/block-dangerous.sh
          assert_ask "$(cmd_payload "git checkout .")" hooks/claude/block-dangerous.sh
          assert_pass "$(cmd_payload "git checkout release/v1.2")" hooks/claude/block-dangerous.sh

          # confirm-external-impact.sh
          assert_ask "$(cmd_payload "git push origin main")" hooks/claude/confirm-external-impact.sh
          assert_ask "$(cmd_payload "gh pr create")" hooks/claude/confirm-external-impact.sh
          assert_ask "$(cmd_payload "aws s3 sync . s3://bucket")" hooks/claude/confirm-external-impact.sh
          assert_ask "$(cmd_payload "flyctl deploy")" hooks/claude/confirm-external-impact.sh
          assert_ask "$(cmd_payload "make deploy")" hooks/claude/confirm-external-impact.sh
          assert_ask "$(cmd_payload "git -C /some/repo push origin main")" hooks/claude/confirm-external-impact.sh
